<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Small Tile 440x280</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 440px;
  height: 280px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0e1a;
  color: #f8fafc;
}

.bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 300px 200px at 20% 30%, rgba(251,191,36,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 280px 250px at 80% 80%, rgba(139,92,246,0.12) 0%, transparent 70%),
    #0a0e1a;
}
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(251,191,36,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(251,191,36,0.04) 1px, transparent 1px);
  background-size: 30px 30px;
}

.layout {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  height: 100%;
  padding: 32px 36px;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.logo {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  box-shadow: 0 0 24px rgba(251,191,36,0.35), 0 4px 16px rgba(0,0,0,0.4);
}
.title {
  font-size: 44px;
  font-weight: 900;
  font-family: 'Georgia', 'Times New Roman', serif;
  font-style: italic;
  background: linear-gradient(135deg, #fbbf24 0%, #fde68a 50%, #d97706 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  filter: drop-shadow(0 0 16px rgba(251,191,36,0.25));
}

.tagline {
  font-size: 15px;
  color: #cbd5e1;
  margin-bottom: 22px;
  line-height: 1.4;
  font-weight: 400;
}
.tagline strong { color: #f8fafc; font-weight: 700; }

.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: rgba(251,191,36,0.08);
  border: 1px solid rgba(251,191,36,0.2);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: #fde68a;
}

.badge {
  position: absolute;
  bottom: 28px;
  right: 32px;
  padding: 6px 14px;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  color: #0a0e1a;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 12px rgba(251,191,36,0.4);
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="layout">
  <div class="logo-row">
    <div class="logo">🔍</div>
    <div class="title">Faux Spy</div>
  </div>
  <div class="tagline">
    <strong>Detect AI-Generated Images</strong><br>
    Spy on the fakes — instantly
  </div>
  <div class="pills">
    <div class="pill">🕵️ Hover Detection</div>
    <div class="pill">⚡ Real-Time</div>
    <div class="pill">🌐 Any Website</div>
  </div>
</div>
<div class="badge">Free to Install</div>
</body>
</html>
